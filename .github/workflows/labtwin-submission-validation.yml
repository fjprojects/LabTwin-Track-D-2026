name: LabTwin submission and account regression checks

on:
  push:
    branches:
      - feature/supabase-durable-storage-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONPATH: .:backend
      DJANGO_SETTINGS_MODULE: backend.test_settings
      LABTWIN_DISABLE_REMOTE_AI: "true"
      LABTWIN_EMBEDDING_BACKEND: hash
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native dependencies required by production demo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install current deployed Python requirements
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-render.txt
      - name: Test actual Django student and teacher submission routes
        run: |
          python backend/manage.py test \
            labtwin.test_classrooms \
            labtwin.test_assessments \
            labtwin.test_learning \
            labtwin.test_response_history \
            labtwin.test_password_reset \
            labtwin.test_phone_recovery \
            --settings=backend.test_settings --noinput --verbosity 2
      - name: Validate database model migrations
        run: python backend/manage.py makemigrations --check --dry-run --settings=backend.test_settings

  frontend-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Test authentication and response handling
        working-directory: frontend
        run: |
          npm run test:auth
          npm run test:api
      - name: Validate frontend production build
        working-directory: frontend
        run: |
          npm run build
          npm run lint
