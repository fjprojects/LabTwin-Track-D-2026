name: Assessment quality and activity checks

on:
  push:
    branches: [fix/assessment-quality-activity-20261014]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:backend
      DJANGO_SETTINGS_MODULE: backend.test_settings
      LABTWIN_DISABLE_REMOTE_AI: "true"
      LABTWIN_EMBEDDING_BACKEND: hash
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native tools required by ingestion and demo tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg poppler-utils tesseract-ocr
      - name: Install backend packages
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-render.txt
      - name: Install isolated DeepEval environment for full Track D regression
        run: |
          python -m venv .venv-evaluation
          .venv-evaluation/bin/python -m pip install --disable-pip-version-check --no-input -r requirements-evaluation.txt
          echo "LABTWIN_TEST_EVALUATOR_PYTHON=$GITHUB_WORKSPACE/.venv-evaluation/bin/python" >> "$GITHUB_ENV"
      - name: Run backend learning, assessment, integrity, OCR and camera regressions
        run: |
          python backend/manage.py test \
            labtwin.test_question_quality \
            labtwin.test_assessment_activity \
            labtwin.test_assessment_camera \
            labtwin.test_track_d \
            labtwin.test_assessments \
            labtwin.test_learning \
            --settings=backend.test_settings --noinput --verbosity 2
      - name: Check migration drift
        run: python backend/manage.py makemigrations --check --dry-run --settings=backend.test_settings

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm run test:api
          npm run test:auth
          npm run build
          npm run lint
